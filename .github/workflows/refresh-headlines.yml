name: Refresh headlines

# Pulls public news RSS feeds and commits data/headlines.json.
# Runs on GitHub's servers, so there is no CORS restriction and no API key.
# The site picks the file up on the next load — no rebuild needed.

on:
  schedule:
    - cron: "17 * * * *"      # hourly, at 17 past
  workflow_dispatch:           # and whenever you click Run workflow

permissions:
  contents: write

concurrency:
  group: refresh-headlines
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: node scripts/fetch-headlines.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/headlines.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "knowledge-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json
          git commit -m "Refresh headlines"
          git push
